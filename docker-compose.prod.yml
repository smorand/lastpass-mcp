services:
  lastpass-mcp:
    build: .
    container_name: lastpass-mcp
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - /app/data/lastpass-mcp/.env
    volumes:
      - /app/data/lastpass-mcp/state:/data
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
